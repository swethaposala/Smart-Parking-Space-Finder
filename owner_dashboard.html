<!DOCTYPE html>
<html>
<head>

<title>Owner Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between">

<h2>Owner Dashboard</h2>

<a href="/logout" class="btn btn-danger">Logout</a>

</div>

<hr>

<a href="/add_slot" class="btn btn-primary">Add Slots</a>

<a href="/owner_history" class="btn btn-success">History</a>

<br><br>

<table class="table table-bordered">

<tr>
<th>Slot</th>
<th>Location</th>
<th>Price</th>
<th>Facilities</th>
<th>Status</th>
</tr>

{% for slot in slots %}

<tr>
<td>{{slot.slot_number}}</td>
<td>{{slot.location}}</td>
<td>{{slot.price}}</td>
<td>{{slot.facilities}}</td>
<td>{{slot.status}}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
