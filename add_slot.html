<!DOCTYPE html>
<html>

<head>

<title>Add Parking Slots</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

<div class="d-flex justify-content-between">

<h2>Add Parking Slots</h2>

<a href="/owner_dashboard" class="btn btn-secondary">Back</a>

</div>

<hr>

<form method="POST">

<div class="mb-3">

<label>Total Slots</label>

<input
type="number"
name="total_slots"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Location</label>

<input
type="text"
name="location"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Car Price (per hour)</label>

<input
type="number"
name="car_price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Bike Price (per hour)</label>

<input
type="number"
name="bike_price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Facilities</label><br>

<input type="checkbox" name="facilities" value="EV Charging"> EV Charging <br>

<input type="checkbox" name="facilities" value="CCTV"> CCTV <br>

<input type="checkbox" name="facilities" value="Security"> Security <br>

</div>

<button class="btn btn-success">Add Slots</button>

</form>

</div>

</body>

</html>
